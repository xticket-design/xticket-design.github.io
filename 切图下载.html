<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>切图下载 · XTicket</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f6f4;color:#202522;font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{background:white;border-bottom:1px solid #e9eae5;padding:20px max(5%,calc((100% - 1440px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid #b48d09;outline-offset:3px}main{max-width:1440px;margin:auto;padding:44px 5%}h1{font-size:26px;margin:0 0 10px}p{color:#6f7772;line-height:1.7}.back{font-size:14px;color:#626b65}.packs{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 30px}.pack{background:#212622;color:#fff;border-radius:8px;padding:12px 16px;font-size:14px}.pack.secondary{background:#fff;color:#252c27;border:1px solid #e0e4dd}.tools{display:flex;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:18px}.tools label{display:grid;gap:8px;font-size:13px;color:#646d67}.tools select,.tools input{min-width:170px;border:1px solid #dde2dc;padding:10px 12px;background:white;border-radius:8px;color:#222;font:inherit}.desc{font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.item{background:white;border:1px solid #ebeee9;border-radius:10px;overflow:hidden}.preview{height:128px;background:#eef1ed;display:grid;place-items:center;padding:14px}.preview.dark{background:#59616c}.preview img{max-width:100%;max-height:100%;object-fit:contain}.preview img.icon{width:64px;height:64px;image-rendering:auto}.body{padding:14px}.name{font-size:13px;overflow-wrap:anywhere;font-weight:600;min-height:40px}.meta{font-size:12px;color:#8d9690;margin:8px 0 14px}.download{font-size:13px;color:#424e46}.notice{background:#fff9e7;color:#71622e;padding:14px 16px;border-radius:8px;font-size:13px}.counts{color:#8a938d;font-size:13px}@media(max-width:600px){header{align-items:start;flex-direction:column}main{padding-top:28px}.tools label{width:100%}.tools select,.tools input{width:100%}}</style></head><body><header><strong>XTicket · 切图资源</strong><a class="back" href="./">← 返回交互演示</a></header><main><h1>为原生开发准备的切图</h1><p>来自 Pixso「定稿」页的独立图层，按用途命名并从原图层分别导出不同倍率。</p><div class="packs"><a class="pack" href="downloads/ios-assets.zip" download>下载 iOS 全倍率包 ↓</a><a class="pack" href="downloads/android-assets.zip" download>下载 Android 全密度包 ↓</a></div><p class="notice">iOS 包含 1×、2×、3× Imageset；Android 包含 mdpi、hdpi、xhdpi、xxhdpi、xxxhdpi 目录。背景中的位图内容仍受原始素材清晰度影响。</p><div class="tools"><label>开发平台<select id="platform"><option value="ios">iOS</option><option value="android">Android</option></select></label><label>导出倍率<select id="scale"></select></label><label>搜索素材<input type="search" id="search" placeholder="搜索名称，如 warranty"></label><a class="pack secondary" id="scalePack" href="#" download>下载当前倍率 ↓</a></div><p class="counts" id="count"></p><div class="grid" id="grid"></div></main><script>
const platform=document.getElementById('platform'),scale=document.getElementById('scale'),search=document.getElementById('search'),grid=document.getElementById('grid');let items=[];const opts={ios:[['1','1×'],['2','2×'],['3','3×']],android:[['1','mdpi · 1×'],['1.5','hdpi · 1.5×'],['2','xhdpi · 2×'],['3','xxhdpi · 3×'],['4','xxxhdpi · 4×']]};function setScales(){scale.innerHTML=opts[platform.value].map(([v,n])=>`<option value="${v}">${n}</option>`).join('');scale.value='2';render()}function render(){let s=scale.value,q=search.value.trim().toLowerCase(),filtered=items.filter(it=>(it.name+' '+it.label).toLowerCase().includes(q));document.getElementById('count').textContent=`共 ${items.length} 项 · 当前显示 ${filtered.length} 项`;const dpi={'1':'mdpi','1.5':'hdpi','2':'xhdpi','3':'xxhdpi','4':'xxxhdpi'};document.getElementById('scalePack').href=platform.value==='ios'?`downloads/ios-${s}x.zip`:`downloads/android-${dpi[s]}.zip`;grid.innerHTML=filtered.map(it=>{let image=`cutouts/${s}/${it.name}.png`,preview=`cutouts/4/${it.name}.png`,suffix=platform.value==='ios'&&s!=='1'?`@${s}x`:'';let dark=it.name.endsWith('_white');return `<article class="item"><div class="preview ${dark?'dark':''}"><img class="${it.width<100?'icon':''}" src="${preview}" alt="${it.name}"></div><div class="body"><div class="name">${it.label}<br><span style="font-weight:400;color:#7b847e">${it.name}</span></div><div class="meta">原始尺寸 ${it.width} × ${it.height} · ${s}×</div><a class="download" href="${image}" download="${it.name}${suffix}.png">下载 PNG ↓</a></div></article>`}).join('')}platform.onchange=setScales;scale.onchange=render;search.oninput=render;fetch('cutouts.json').then(r=>{if(!r.ok)throw Error('load');return r.json()}).then(data=>{items=data;setScales()}).catch(()=>{document.getElementById('count').textContent='素材清单加载失败，请刷新重试。'});

const splitPacks={"ios-assets.zip": ["ios-assets.zip.part000", "ios-assets.zip.part001", "ios-assets.zip.part002", "ios-assets.zip.part003"], "ios-3x.zip": ["ios-3x.zip.part000", "ios-3x.zip.part001"], "android-xxhdpi.zip": ["android-xxhdpi.zip.part000", "android-xxhdpi.zip.part001"], "android-xxxhdpi.zip": ["android-xxxhdpi.zip.part000", "android-xxxhdpi.zip.part001", "android-xxxhdpi.zip.part002", "android-xxxhdpi.zip.part003"], "android-assets.zip": ["android-assets.zip.part000", "android-assets.zip.part001", "android-assets.zip.part002", "android-assets.zip.part003", "android-assets.zip.part004", "android-assets.zip.part005", "android-assets.zip.part006"]};document.addEventListener('click',async e=>{let a=e.target.closest('a[download]');if(!a)return;let name=a.getAttribute('href')?.split('/').pop();if(!splitPacks[name])return;e.preventDefault();let old=a.textContent;a.textContent='正在准备下载…';try{let parts=await Promise.all(splitPacks[name].map(async p=>{let r=await fetch('downloads/'+p);if(!r.ok)throw Error('download');return r.arrayBuffer()}));let url=URL.createObjectURL(new Blob(parts,{type:'application/zip'}));let link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(err){alert('下载失败，请刷新页面后重试。')}finally{a.textContent=old}});
</script></body></html>
